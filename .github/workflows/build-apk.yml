name: Build Signed Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Generate Keystore and Build Signed Release APK
        run: |
          # Automatically find the directory containing settings.gradle (in case files were uploaded inside a subfolder)
          PROJECT_DIR=$(dirname $(find . -name "settings.gradle" | head -n 1))
          echo "Found Android project in: $PROJECT_DIR"
          cd "$PROJECT_DIR"

          # Generate release keystore if not present
          if [ ! -f "release-key.jks" ]; then
            keytool -genkeypair -v \
              -keystore release-key.jks \
              -alias paper1mock \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storepass paper1mock123 \
              -keypass paper1mock123 \
              -dname "CN=IndoreFlorist, OU=Education, O=IndoreFlorist, L=Indore, ST=MP, C=IN"
          fi

          # Compile and sign the release APK using Gradle 8.7
          gradle assembleRelease --no-daemon

          # Copy APK to root workspace for easy artifact upload
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/Paper-1-Mock.apk"
          
          # Print exact size in bytes and KB
          BYTES=$(stat -c%s "$GITHUB_WORKSPACE/Paper-1-Mock.apk")
          echo "### ✅ APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **File Name:** \`Paper-1-Mock.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Exact Size:** $BYTES bytes (~$((BYTES / 1024)) KB)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paper-1-Mock-Release-APK
          path: Paper-1-Mock.apk
