name: Build Signed Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Android SDK is already preinstalled on ubuntu-latest, so no SDK setup step needed.
      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Keystore and Build Signed Release APK
        run: |
          chmod +x build_release_apk.sh
          ./build_release_apk.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Paper-1-Mock-Release-APK
          path: app/build/outputs/apk/release/app-release.apk
