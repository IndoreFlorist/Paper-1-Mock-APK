name: Build Signed Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Generate Keystore and Build Signed Release APK
        env:
          KEYSTORE_PASSWORD: paper1mock123
          KEY_ALIAS: paper1mock
          KEY_PASSWORD: paper1mock123
        run: |
          # Generate release keystore in both root and app/ directory
          keytool -genkeypair -v \
            -keystore release-key.jks \
            -alias paper1mock \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass paper1mock123 \
            -keypass paper1mock123 \
            -dname "CN=IndoreFlorist, OU=Education, O=IndoreFlorist, L=Indore, ST=MP, C=IN"
          cp release-key.jks app/release-key.jks

          # Accept SDK licenses
          yes | sdkmanager --licenses || true

          # Compile and sign the release APK using Gradle 8.9
          gradle assembleRelease --no-daemon --stacktrace

          # Locate the output APK and sign if needed
          APK_PATH=$(find app/build/outputs/apk/release/ -name "*.apk" | head -n 1)
          echo "Found generated APK at: $APK_PATH"

          if [[ "$APK_PATH" == *"unsigned"* ]]; then
            BUILD_TOOLS_DIR=$(ls -d $ANDROID_HOME/build-tools/* | tail -n 1)
            "$BUILD_TOOLS_DIR/zipalign" -v -p 4 "$APK_PATH" aligned.apk
            "$BUILD_TOOLS_DIR/apksigner" sign \
              --ks release-key.jks \
              --ks-key-alias paper1mock \
              --ks-pass pass:paper1mock123 \
              --key-pass pass:paper1mock123 \
              --out "$GITHUB_WORKSPACE/Paper-1-Mock.apk" \
              aligned.apk
          else
            cp "$APK_PATH" "$GITHUB_WORKSPACE/Paper-1-Mock.apk"
          fi

          # Print exact size in bytes and KB
          BYTES=$(stat -c%s "$GITHUB_WORKSPACE/Paper-1-Mock.apk")
          echo "### ✅ APK Built Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "- **File Name:** \`Paper-1-Mock.apk\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Exact Size:** $BYTES bytes (~$((BYTES / 1024)) KB)" >> $GITHUB_STEP_SUMMARY

      - name: Upload Signed Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Paper-1-Mock-Release-APK
          path: Paper-1-Mock.apk
